services:
  mysql:
    image: mysql:8.4.10
    container_name: mysql
    restart: always
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql
      - db_data:/var/log/mysql

volumes:
  db_data:
